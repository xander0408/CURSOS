<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>AI Business Lab — MagnaTic</title>
  <style>
    html, body { margin: 0; background: #050508; }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050508;
    }
    #boot-splash img {
      width: auto;
      max-width: min(240px, 72vw);
      max-height: min(280px, 50vh);
      object-fit: contain;
    }
  </style>
  <script>
    (function () {
      var segs = (location.pathname || "/").split("/").filter(Boolean);
      var repo = segs[0] || "CURSOS";
      var base = "/" + repo + "/";
      window.__abl404Base = base;
      location.replace(base + (location.search || "") + (location.hash || ""));
    })();
  </script>
</head>
<body>
  <div id="boot-splash">
    <img id="brand-splash" alt="MagnaTic" />
  </div>
  <script>
    (function () {
      var base = window.__abl404Base || "/CURSOS/";
      var img = document.getElementById("brand-splash");
      if (img) img.src = base + "avatares/magnatic-perfil-vertical.png";
    })();
  </script>
</body>
</html>
