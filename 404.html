<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>AI Business Lab — Magnatic</title>
  <style>
    html, body { margin: 0; background: #050508; }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050508;
    }
    #boot-splash img {
      width: auto;
      max-width: min(240px, 72vw);
      max-height: min(280px, 50vh);
      object-fit: contain;
    }
  </style>
  <script>
    (function () {
      var spa = { timer:1, modulos:1, modulo:1, retos:1, quiz:1, "prompt-lab":1, comparador:1, biblioteca:1, proyecto:1, progreso:1, perfil:1, cuentas:1, manual:1, admin:1, actividades:1, cronograma:1 };
      var segs = (location.pathname || "/").split("/").filter(Boolean);
      var repo = segs[0] || "CURSOS";
      var rest = segs.slice(1);
      if (spa[String(repo).toLowerCase()]) {
        rest = segs;
        repo = "";
      }
      var extra = rest.filter(function (s) { return s !== "index.html"; }).join("/");
      var hash = location.hash || "";
      if (extra && (!hash || hash === "#" || hash === "#/")) {
        hash = "#/" + extra.replace(/\/+$/, "");
      }
      var base = repo ? "/" + repo + "/" : "/";
      window.__abl404Base = base;
      location.replace(base + (location.search || "") + hash);
    })();
  </script>
</head>
<body>
  <div id="boot-splash">
    <img id="brand-splash" alt="Magnatic" />
  </div>
  <script>
    (function () {
      var base = window.__abl404Base || "/CURSOS/";
      var img = document.getElementById("brand-splash");
      if (img) img.src = base + "avatares/magnatic-perfil-vertical.png";
    })();
  </script>
</body>
</html>
