<svg width="3840" height="3840" viewBox="-2 -10 84 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hd" x1="18" y1="8" x2="62" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="bd" x1="20" y1="46" x2="60" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset="1" stop-color="#9A3412" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <g>
    <!-- Body -->
    <path d="M22 54 Q22 48 40 46 Q58 48 58 54 L60 70 Q60 74 40 74 Q20 74 20 70 Z" fill="url(#bd)"/>
    <path d="M22 54 Q22 48 40 46 Q58 48 58 54 L59 58 Q40 56 21 58 Z" fill="white" opacity="0.25"/>

    <!-- Shoulder accents -->
    <rect x="16" y="52" width="8" height="4" rx="2" fill="#9A3412" opacity="0.5"/>
    <rect x="56" y="52" width="8" height="4" rx="2" fill="#9A3412" opacity="0.5"/>
    <circle cx="19" cy="54" r="1.5" fill="#FB923C"/>
    <circle cx="61" cy="54" r="1.5" fill="#FB923C"/>

    <!-- Chest core -->
    <circle cx="40" cy="62" r="5" fill="#9A3412" opacity="0.25"/>
    <circle cx="40" cy="62" r="3.5" fill="#FB923C" opacity="0.6"/>
    <circle cx="40" cy="62" r="2" fill="white" opacity="0.8"/>

    <!-- Neck -->
    <rect x="36" y="42" width="8" height="5" rx="3" fill="#F97316"/>

    <!-- Head -->
    <rect x="18" y="8" width="44" height="38" rx="14" fill="url(#hd)"/>
    <ellipse cx="34" cy="14" rx="12" ry="3.5" fill="white" opacity="0.3"/>

    <!-- ===== Accesorio de diseñador: lápiz/pincel de creación ===== -->
    <!-- Lápiz sobre la cabeza (diagonal) -->
    <g transform="rotate(-30 40 2)">
      <rect x="37" y="-8" width="6" height="14" rx="1" fill="#FDE68A" stroke="#B45309" stroke-width="0.6"/>
      <path d="M37 6 L40 10 L43 6 Z" fill="#9A3412"/>
      <rect x="37" y="-8" width="6" height="3" rx="1" fill="#F97316"/>
    </g>
    <!-- Chispa de creatividad -->
    <path d="M56 2 l1 2.4 l2.4 1 l-2.4 1 l-1 2.4 l-1 -2.4 l-2.4 -1 l2.4 -1 Z" fill="#FDE68A" opacity="0.9"/>

    <!-- Face panel -->
    <rect x="24" y="20" width="32" height="18" rx="9" fill="white" opacity="0.1"/>

    <!-- Eyes (con destello de "modo diseño") -->
    <circle cx="33" cy="27" r="6.5" fill="white"/>
    <circle cx="47" cy="27" r="6.5" fill="white"/>
    <circle cx="33" cy="27" r="4.5" fill="#9A3412"/>
    <circle cx="47" cy="27" r="4.5" fill="#9A3412"/>
    <circle cx="34.5" cy="25.5" r="1.8" fill="white" opacity="0.9"/>
    <circle cx="48.5" cy="25.5" r="1.8" fill="white" opacity="0.9"/>

    <!-- Mouth (sonrisa creativa) -->
    <path d="M34 37 Q40 42 46 37" stroke="#9A3412" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.65"/>

    <!-- Mejillas -->
    <circle cx="26" cy="32" r="2.5" fill="white" opacity="0.14"/>
    <circle cx="54" cy="32" r="2.5" fill="white" opacity="0.14"/>

    <!-- Ear panels -->
    <rect x="12" y="22" width="6" height="12" rx="3" fill="#F97316" stroke="#9A3412" stroke-width="0.8"/>
    <rect x="13.5" y="25.5" width="3" height="3" rx="1.5" fill="#FB923C" opacity="0.75"/>
    <rect x="62" y="22" width="6" height="12" rx="3" fill="#F97316" stroke="#9A3412" stroke-width="0.8"/>
    <rect x="63.5" y="25.5" width="3" height="3" rx="1.5" fill="#FB923C" opacity="0.75"/>

    <!-- Paleta de colores en el pecho (detalle de diseñador) -->
    <circle cx="34" cy="57" r="1.3" fill="#EF4444" opacity="0.7"/>
    <circle cx="38" cy="56" r="1.3" fill="#3B82F6" opacity="0.7"/>
    <circle cx="42" cy="56" r="1.3" fill="#22C55E" opacity="0.7"/>
    <circle cx="46" cy="57" r="1.3" fill="#A855F7" opacity="0.7"/>

    <!-- Status indicator -->
    <circle cx="60" cy="12" r="4" fill="white"/>
    <circle cx="60" cy="12" r="2.5" fill="#10b981"/>
  </g>
</svg>
