<svg width="3840" height="3840" viewBox="-2 -6 84 86" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="hd" cx="40%" cy="35%" r="50%">
      <stop stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </radialGradient>
    <linearGradient id="bd" x1="27" y1="53" x2="53" y2="73" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <g>
    <!-- Antenna -->
    <line x1="40" y1="3" x2="40" y2="10" stroke="#1ed5a4" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="40" cy="2" r="4" fill="#1ed5a4" opacity="0.8"/>
    <circle cx="40" cy="2" r="2" fill="white" opacity="0.8"/>

    <!-- Big spherical head -->
    <circle cx="40" cy="32" r="26" fill="url(#hd)"/>
    <ellipse cx="33" cy="16" rx="12" ry="6" fill="white" opacity="0.18"/>

    <!-- Eyes -->
    <circle cx="30" cy="33" r="7" fill="white"/>
    <circle cx="30" cy="33" r="5.5" fill="#5f27d4"/>
    <circle cx="32" cy="31" r="2" fill="white" opacity="0.9"/>
    <circle cx="28.5" cy="35" r="0.8" fill="white" opacity="0.4"/>
    <circle cx="50" cy="33" r="7" fill="white"/>
    <circle cx="50" cy="33" r="5.5" fill="#5f27d4"/>
    <circle cx="52" cy="31" r="2" fill="white" opacity="0.9"/>
    <circle cx="48.5" cy="35" r="0.8" fill="white" opacity="0.4"/>

    <!-- Glasses (well separated - gap of 4 units between lenses) -->
    <circle cx="30" cy="33" r="8.5" fill="none" stroke="#7C3AED" stroke-width="2.2" opacity="0.7"/>
    <circle cx="50" cy="33" r="8.5" fill="none" stroke="#7C3AED" stroke-width="2.2" opacity="0.7"/>
    <!-- Bridge (short horizontal line between the two lenses) -->
    <line x1="38.5" y1="33" x2="41.5" y2="33" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <!-- Temple arms -->
    <line x1="21.5" y1="31" x2="16" y2="29" stroke="#7C3AED" stroke-width="1.5" opacity="0.45"/>
    <line x1="58.5" y1="31" x2="64" y2="29" stroke="#7C3AED" stroke-width="1.5" opacity="0.45"/>

    <!-- Mouth -->
    <path d="M35 46 Q40 50 45 46" stroke="#1ed5a4" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Cheeks -->
    <circle cx="19" cy="40" r="4" fill="#1ed5a4" opacity="0.15"/>
    <circle cx="61" cy="40" r="4" fill="#1ed5a4" opacity="0.15"/>

    <!-- Compact body -->
    <path d="M28 57 Q28 54 40 53 Q52 54 52 57 L53 69 Q53 73 40 73 Q27 73 27 69 Z" fill="url(#bd)"/>
    <path d="M28 57 Q28 54 40 53 Q52 54 52 57 L52.5 59 Q40 58 27.5 59 Z" fill="white" opacity="0.18"/>

    <!-- Chest light -->
    <circle cx="40" cy="63" r="4" fill="#1ed5a4" opacity="0.25"/>
    <circle cx="40" cy="63" r="2.5" fill="#1ed5a4" opacity="0.55"/>
    <circle cx="40" cy="63" r="1.3" fill="white" opacity="0.8"/>

    <!-- Arms -->
    <rect x="21" y="58" width="6" height="4" rx="2" fill="#A78BFA" opacity="0.7"/>
    <rect x="53" y="58" width="6" height="4" rx="2" fill="#A78BFA" opacity="0.7"/>

    <!-- Status -->
    <circle cx="62" cy="10" r="4.5" fill="white"/>
    <circle cx="62" cy="10" r="3" fill="#10b981" opacity="0.85"/>
  </g>
</svg>
