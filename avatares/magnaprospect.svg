    <circle cx="31" cy="-3" r="1.4" fill="#FEF3C7"/>
    <circle cx="40" cy="-6" r="1.6" fill="#FEF3C7"/>
    <circle cx="49" cy="-3" r="1.4" fill="#FEF3C7"/>
    <rect x="28" y="4" width="24" height="2.4" rx="1" fill="#F59E0B" opacity="0.9"/>

